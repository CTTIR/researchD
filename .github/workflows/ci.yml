name: Server and connected client

on:
  push:
    branches: [main, 'dev/**']
  pull_request:
  workflow_dispatch:
    inputs:
      client_ref:
        description: 'researchR branch, tag or commit to test with this server'
        type: string
        default: main

permissions:
  contents: read

concurrency:
  group: researchD-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Offline suites and real HTTP client (R ${{ matrix.r }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        r: ['4.4.1', 'release']
    defaults:
      run:
        working-directory: researchD
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: researchD
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: CTTIR/researchR
          ref: ${{ inputs.client_ref || 'main' }}
          path: researchR
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true
      - name: Install test dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-test.txt
          .venv/bin/python -m pip check
          Rscript -e 'install.packages(c("yaml", "DBI", "RSQLite", "filelock", "httr2", "jsonlite", "htmltools", "cli", "rlang", "tibble", "testthat", "pkgload", "withr"), repos = getOption("repos"))'
      - name: Parse Python and shell sources
        run: |
          .venv/bin/python -m compileall -q web scripts dev/tests
          for script in entrypoint.sh cron.sh scripts/*.sh dev/tests/*.sh; do
            bash -n "$script"
          done
      - name: Offline service and engine regression suites
        run: PATH="$PWD/.venv/bin:$PATH" dev/tests/run_all.sh
      - name: researchR against a real disposable HTTP server
        run: PATH="$PWD/.venv/bin:$PATH" dev/tests/integration_client.sh

  compose:
    name: Compose build and startup smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare isolated first-use configuration
        run: |
          python3 scripts/setup.py --project researchd-ci
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path(".env")
          text = path.read_text()
          for key in ("CRON_SCHEDULE", "CRON_FAST_SCHEDULE"):
              text = re.sub(rf"^{key}=.*$", f"{key}=0 0 31 2 *", text, flags=re.MULTILINE)
          path.write_text(text)
          PY
      - name: Build and start all services
        run: |
          docker compose config --quiet
          docker compose build
          docker compose up -d --wait --wait-timeout 120
          curl --fail --silent http://127.0.0.1:8000/healthz
      - name: Exercise idle startup, cron environment, file delivery, API, RSS and SMTP
        run: |
          docker compose exec -T pipeline Rscript R/run_all.R
          python3 dev/tests/compose_smoke.py
      - name: Show service state
        if: always()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=100
      - name: Stop services
        if: always()
        run: docker compose down
