<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in</title><link rel="stylesheet" href="/static/style.css"></head>
<body><main class="wrap narrow">
<h1>Log in</h1>
{% if error %}<p class="err" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/login">
  <label for="username">Username</label><input id="username" name="username" autocomplete="username" required autofocus>
  <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required>
  <button type="submit">Continue</button>
</form></main></body></html>
