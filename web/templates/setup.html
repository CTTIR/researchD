<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>First-run setup</title><link rel="stylesheet" href="/static/style.css"></head>
<body><main class="wrap narrow">
<h1>Create admin account</h1>
<p class="muted">First-run setup. This creates the single admin user. You'll add
2-factor authentication right after. Passwords must fit within 72 UTF-8 bytes.</p>
{% if error %}<p class="err" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/setup">
  <label for="username">Username</label><input id="username" name="username" autocomplete="username" required autofocus>
  <label for="password">Password (≥10 chars)</label><input id="password" name="password" type="password" autocomplete="new-password" minlength="10" required>
  <label for="password2">Confirm password</label><input id="password2" name="password2" type="password" autocomplete="new-password" minlength="10" required>
  <button type="submit">Create account</button>
</form></main></body></html>
